<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUSTON | Админка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #08080a;
            --bg-secondary: #111114;
            --bg-card: #16161c;
            --border-color: #22222b;
            --text-primary: #f0ece4;
            --text-secondary: #9a9996;
            --text-muted: #636260;
            --accent-gold: #f7c948;
            --accent-green: #2dd4a8;
            --accent-red: #f8716e;
            --accent-blue: #60a5fa;
            --glass-bg: rgba(22, 22, 28, 0.7);
            --glass-border: rgba(255, 255, 255, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .admin-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* Header */
        .admin-header {
            padding: 20px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .admin-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .admin-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Form */
        .form-section {
            padding: 16px;
            margin: 16px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(247, 201, 72, 0.05);
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s, background 0.2s;
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: #000;
        }

        .btn-primary:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:active {
            background: var(--border-color);
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
            flex: 0;
            padding: 8px 12px;
        }

        .btn-danger:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Products List */
        .products-section {
            padding: 16px;
            margin: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .product-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .product-item:active {
            background: var(--bg-secondary);
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: var(--accent-blue);
            color: #fff;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-edit:active {
            opacity: 0.8;
        }

        .btn-delete {
            background: var(--accent-red);
            color: #fff;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-delete:active {
            opacity: 0.8;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Status Messages */
        .status-message {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            animation: slideDown 0.3s ease-out;
            max-width: 440px;
            margin: 0 auto;
            z-index: 1000;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .status-message.success {
            background: rgba(45, 212, 168, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-message.error {
            background: rgba(248, 113, 110, 0.1);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .status-message.loading {
            background: rgba(96, 165, 250, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        /* Loader */
        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .products-loader {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            width: 100%;
            background: var(--bg-primary);
            border-radius: 16px 16px 0 0;
            padding: 24px 16px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Админка</h1>
            <p class="admin-subtitle">Управление ценами и товарами</p>
        </div>

        <div class="form-section">
            <h2 class="section-title">Добавить товар</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Название товара</label>
                    <input type="text" id="productName" placeholder="Например: Яблоко" required>
                </div>

                <div class="form-group">
                    <label for="productDesc">Описание</label>
                    <textarea id="productDesc" placeholder="Опишите товар..."></textarea>
                </div>

                <div class="form-group">
                    <label for="productPrice">Цена (₽)</label>
                    <input type="number" id="productPrice" placeholder="0" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="productType">Тип</label>
                    <select id="productType">
                        <option value="cafe">Кафе</option>
                        <option value="market">Магазин</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productCategory">Категория</label>
                    <input type="text" id="productCategory" placeholder="Например: dish, shashlik, grocery">
                </div>

                <div class="form-group">
                    <label for="productEmoji">Эмодзи</label>
                    <input type="text" id="productEmoji" placeholder="🍽️" maxlength="2">
                </div>

                <div class="form-group">
                    <label for="productImage">Картинка</label>
                    <input type="file" id="productImage" accept="image/*">
                    <img id="productImagePreview" style="display:none; margin-top:8px; width:96px; height:96px; object-fit:cover; border-radius:12px; border:1px solid var(--border-color);">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary" id="submitBtn">Добавить</button>
                    <button type="reset" class="btn-secondary">Очистить</button>
                </div>
            </form>
        </div>

        <div class="products-section">
            <h2 class="section-title">Товары</h2>
            <div id="productsList"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Редактировать товар</h2>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label for="editProductName">Название товара</label>
                    <input type="text" id="editProductName" required>
                </div>

                <div class="form-group">
                    <label for="editProductDesc">Описание</label>
                    <textarea id="editProductDesc"></textarea>
                </div>

                <div class="form-group">
                    <label for="editProductPrice">Цена (₽)</label>
                    <input type="number" id="editProductPrice" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="editProductType">Тип</label>
                    <select id="editProductType">
                        <option value="cafe">Кафе</option>
                        <option value="market">Магазин</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editProductCategory">Категория</label>
                    <input type="text" id="editProductCategory" placeholder="Например: dish, shashlik, grocery">
                </div>

                <div class="form-group">
                    <label for="editProductEmoji">Эмодзи</label>
                    <input type="text" id="editProductEmoji" placeholder="🍽️" maxlength="2">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            updateDoc, 
            deleteDoc, 
            doc,
            onSnapshot,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApneyBzn708eU5WWaRaEvJyXu7SSVCEWo",
            authDomain: "busston-768d8.firebaseapp.com",
            projectId: "busston-768d8",
            storageBucket: "busston-768d8.firebasestorage.app",
            messagingSenderId: "703723271340",
            appId: "1:703723271340:web:09b837ca6f085337cd5b09",
            measurementId: "G-QF5PWNV4WC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ========== IMGBB ЗАГРУЗКА КАРТИНОК ==========
        const IMGBB_API_KEY = '044c84fb33e068293052ead694715174';

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', file);

            const response = await fetch('https://api.imgbb.com/1/upload', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (!result.success) {
                throw new Error(result.error?.message || 'Ошибка загрузки на ImgBB');
            }
            return result.data.url;
        }

        // Превью выбранного файла до загрузки
        document.getElementById('productImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('productImagePreview');
            if (!file) {
                preview.style.display = 'none';
                return;
            }
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        });

        let currentEditId = null;

        // Show status message
        function showStatus(message, type = 'success') {
            const status = document.createElement('div');
            status.className = `status-message ${type}`;
            status.textContent = message;
            document.body.appendChild(status);

            setTimeout(() => {
                status.style.animation = 'slideDown 0.3s ease-out reverse';
                setTimeout(() => status.remove(), 300);
            }, 3000);
        }

        // Load products from Firestore
        function loadProducts() {
            const productsList = document.getElementById('productsList');
            const productsRef = collection(db, 'products');
            const q = query(productsRef, orderBy('createdAt', 'desc'));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    productsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📦</div>
                            <p>Товаров пока нет</p>
                        </div>
                    `;
                    return;
                }

                productsList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const product = doc.data();
                    const productEl = document.createElement('div');
                    productEl.className = 'product-item';
                    
                    // Защитный код: гарантируем правильные типы данных
                    const safeName = String(product.name || '');
                    const safeDesc = String(product.desc || '');
                    const safePrice = Number(product.price) || 0;
                    const safeType = String(product.type || 'cafe');
                    const safeCategory = String(product.category || 'other');
                    const safeEmoji = String(product.emoji || '🍽️');
                    const safeImage = String(product.image || product.img || '');
                    
                    productEl.innerHTML = `
                        <div class="product-header">
                            ${safeImage ? `<img src="${escapeHtml(safeImage)}" alt="${escapeHtml(safeName)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;">` : ''}
                            <div class="product-info">
                                <div class="product-name">${escapeHtml(safeName)}</div>
                                ${safeDesc ? `<div class="product-desc">${escapeHtml(safeDesc)}</div>` : ''}
                                <div class="product-price">${safePrice.toFixed(2)} ₽</div>
                                <div class="product-desc" style="margin-top: 6px; font-size: 11px;">
                                    ${safeType} • ${safeCategory}
                                </div>
                            </div>
                            <div class="product-actions">
                                <button class="btn-edit" onclick="openEditModal('${doc.id}', '${escapeHtml(safeName)}', '${escapeHtml(safeDesc)}', ${safePrice}, '${safeType}', '${safeCategory}', '${safeEmoji}')">✏️</button>
                                <button class="btn-delete" onclick="deleteProduct('${doc.id}')">🗑️</button>
                            </div>
                        </div>
                    `;
                    productsList.appendChild(productEl);
                });
            }, (error) => {
                showStatus('Ошибка загрузки товаров: ' + error.message, 'error');
            });
        }

        // Add product
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('productName').value.trim();
            const description = document.getElementById('productDesc').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const type = document.getElementById('productType').value;
            const category = document.getElementById('productCategory').value.trim() || 'other';
            const emoji = document.getElementById('productEmoji').value.trim() || '🍽️';
            const imageFile = document.getElementById('productImage').files[0];

            if (!name || price < 0) {
                showStatus('Заполните все обязательные поля', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            try {
                let imageUrl = '';
                if (imageFile) {
                    showStatus('⏳ Загрузка картинки на ImgBB...', 'loading');
                    imageUrl = await uploadImageToImgBB(imageFile);
                }

                const productsRef = collection(db, 'products');
                await addDoc(productsRef, {
                    name,
                    price: Number(price),
                    category,
                    image: imageUrl,
                    desc: description,
                    type,
                    emoji,
                    img: imageUrl,
                    createdAt: new Date(),
                    updatedAt: new Date()
                });

                document.getElementById('productForm').reset();
                document.getElementById('productEmoji').value = '🍽️';
                document.getElementById('productImagePreview').style.display = 'none';
                showStatus('✓ Товар добавлен успешно', 'success');
            } catch (error) {
                showStatus('Ошибка добавления: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Edit modal functions
        window.openEditModal = (id, name, description, price, type, category, emoji) => {
            currentEditId = id;
            document.getElementById('editProductName').value = name;
            document.getElementById('editProductDesc').value = description;
            document.getElementById('editProductPrice').value = price;
            document.getElementById('editProductType').value = type || 'cafe';
            document.getElementById('editProductCategory').value = category || 'other';
            document.getElementById('editProductEmoji').value = emoji || '🍽️';
            document.getElementById('editModal').classList.add('active');
        };

        window.closeEditModal = () => {
            document.getElementById('editModal').classList.remove('active');
            currentEditId = null;
        };

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentEditId) return;

            const name = document.getElementById('editProductName').value.trim();
            const description = document.getElementById('editProductDesc').value.trim();
            const price = parseFloat(document.getElementById('editProductPrice').value);
            const type = document.getElementById('editProductType').value;
            const category = document.getElementById('editProductCategory').value.trim() || 'other';
            const emoji = document.getElementById('editProductEmoji').value.trim() || '🍽️';

            if (Number.isNaN(price) || price < 0) {
                showStatus('Введите корректную цену', 'error');
                return;
            }

            try {
                const productRef = doc(db, 'products', currentEditId);
                await updateDoc(productRef, {
                    name,
                    desc: description,
                    price: Number(price),
                    type,
                    category,
                    emoji,
                    updatedAt: new Date()
                });

                closeEditModal();
                showStatus('✓ Товар обновлен успешно', 'success');
                loadProducts();
            } catch (error) {
                showStatus('Ошибка обновления: ' + error.message, 'error');
            }
        });

        // Delete product
        window.deleteProduct = async (id) => {
            if (!confirm('Вы уверены? Это действие нельзя отменить.')) return;

            try {
                await deleteDoc(doc(db, 'products', id));
                showStatus('✓ Товар удален успешно', 'success');
            } catch (error) {
                showStatus('Ошибка удаления: ' + error.message, 'error');
            }
        };

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal on background click
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });

        // Load products on page load
        loadProducts();
    </script>
</body>
</html>
