<!-- 
  FIRESTORE INITIALIZATION & REAL-TIME SYNC MODULE
  Для GitHub Pages: правильная обработка CORS, кэширования и ошибок
-->
<script type="module">
  import { 
    initializeApp 
  } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  
  import { 
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    setDoc,
    deleteDoc,
    updateDoc,
    onSnapshot,
    query,
    orderBy,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ========== КОНФИГУРАЦИЯ ==========
  const firebaseConfig = {
    apiKey: "AIzaSyApneYBzn708eUSWVaRaEvJyXu75SVCEWo",
    authDomain: "busston-768d8.firebaseapp.com",  // ✅ ПОЛНЫЙ ДОМЕН (не "://firebaseapp.com")
    projectId: "busston-768d8",
    storageBucket: "busston-768d8.firebasestorage.app",
    messagingSenderId: "703723271340",
    appId: "1:703723271340:web:09b837ca6f085337cd5b09",
    measurementId: "G-OEEDWVWAWG"
  };

  // ========== ИНИЦИАЛИЗАЦИЯ FIREBASE ==========
  let app = null;
  let db = null;
  let isFirebaseReady = false;
  let isConnected = false;
  let productsUnsubscribe = null;

  try {
    app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    
    console.log('📱 Firebase инициализирован');
    console.log('🔗 Проект:', firebaseConfig.projectId);
    console.log('🌐 Protocol:', window.location.protocol);
    
    // Включаем persistence (важно для GitHub Pages)
    enableIndexedDbPersistence(db)
      .then(() => {
        console.log('✅ IndexedDB persistence включена (offline поддержка активна)');
      })
      .catch((err) => {
        if (err.code === 'failed-precondition') {
          console.warn('⚠️ Persistence отключена (множество вкладов или InPrivate режим)');
        } else if (err.code === 'unimplemented') {
          console.warn('⚠️ Браузер не поддерживает persistence');
        }
      });
    
    isFirebaseReady = true;
    
  } catch (err) {
    console.error('❌ ОШИБКА инициализации Firebase:', err.message);
    console.error('   Проверьте конфигурацию и internet соединение');
  }

  // ========== ГЛОБАЛЬНЫЕ ФУНКЦИИ FIRESTORE ==========
  window.firestoreDb = db;
  window.firestoreFuncs = { 
    collection, addDoc, getDocs, getDoc, doc, 
    setDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy 
  };
  window.isFirebaseReady = isFirebaseReady;

  // ========== ЗАГРУЗКА ТОВАРОВ ИЗ FIRESTORE ==========
  window.loadProductsFromFirestore = async function() {
    // ⚠️ Проверяем готовность Firebase
    if (!isFirebaseReady || !db) {
      console.warn('⚠️ Firebase не готов, используем локальные данные');
      return;
    }

    try {
      console.log('📦 Загружаю товары из Firestore...');
      
      const productsRef = collection(db, 'products');
      const q = query(productsRef, orderBy('createdAt', 'desc'));
      
      // ========== REAL-TIME LISTENER (ВАЖНО!) ==========
      // Вместо одноразового getDocs используем onSnapshot
      // Это позволит видеть обновления цен в реальном времени
      if (productsUnsubscribe) {
        productsUnsubscribe();  // Отписываемся от старого слушателя
      }

      productsUnsubscribe = onSnapshot(
        q,
        (snapshot) => {
          // ✅ Данные успешно загружены
          const firestoreProducts = [];
          
          snapshot.forEach(docSnap => {
            const data = docSnap.data() || {};
            
            // ⚠️ ЗАЩИТНЫЙ КОД: нормализуем все поля
            const safeProduct = {
              id: docSnap.id || '',
              name: String(data.name || '').trim() || 'Товар без названия',
              desc: String(data.desc || data.description || '').trim(),
              price: Math.max(0, Number(data.price) || 0),  // Гарантируем число >= 0
              type: ['cafe', 'market'].includes(String(data.type).toLowerCase()) 
                ? String(data.type).toLowerCase() 
                : 'market',
              category: String(data.category || 'other').toLowerCase(),
              emoji: String(data.emoji || '🍽️').slice(0, 2),
              img: String(data.img || '').trim()
            };
            
            // Валидируем важные поля
            if (!Number.isFinite(safeProduct.price)) {
              console.warn(`⚠️ Товар "${safeProduct.name}" имеет некорректную цену:`, data.price);
              safeProduct.price = 0;
            }
            
            firestoreProducts.push(safeProduct);
          });
          
          // Обновляем глобальный список товаров
          if (firestoreProducts.length > 0) {
            products = firestoreProducts;
            saveProducts();
            renderProducts();
            console.log(`✅ Загружено ${firestoreProducts.length} товаров из Firestore`);
            isConnected = true;
          } else {
            console.warn('⚠️ Firestore коллекция пуста');
          }
        },
        
        // ❌ ОБРАБОТКА ОШИБОК
        (error) => {
          console.error('❌ ОШИБКА при получении товаров из Firestore:', error);
          
          // Анализируем тип ошибки
          if (error.code === 'permission-denied') {
            console.error('   → ЗАПРЕЩЕН ДОСТУП (проверьте Firebase Security Rules)');
            console.error('   → Откройте https://console.firebase.google.com');
            console.error('   → Перейдите в Firestore Database → Rules');
          } else if (error.code === 'failed-precondition') {
            console.error('   → Предусловие не выполнено');
          } else if (error.code === 'unavailable') {
            console.error('   → Сервис недоступен (проблема с интернетом)');
            isConnected = false;
          } else if (error.code === 'unauthenticated') {
            console.error('   → Требуется аутентификация');
          } else if (error.message.includes('Failed to get document')) {
            console.error('   → CORS ошибка? Проверьте консоль браузера');
          }
          
          // Пытаемся подключиться заново через 5 секунд
          console.log('🔄 Переподключение через 5 секунд...');
          setTimeout(() => {
            window.loadProductsFromFirestore();
          }, 5000);
        }
      );
      
    } catch (err) {
      console.error('❌ EXCEPTION в loadProductsFromFirestore:', err);
      console.error('   Message:', err.message);
      console.error('   Code:', err.code);
      
      // Проверяем специфические ошибки GitHub Pages
      if (err.message.includes('Cross-Origin Request Blocked')) {
        console.error('   → CORS ОШИБКА! Это может быть из-за:');
        console.error('      1. Неверной authDomain в config');
        console.error('      2. GitHub Pages HTTPS требует полного https URL');
        console.error('      3. Firebase CORS конфигурация');
      }
    }
  };

  // ========== МОНИТОРИНГ ИНТЕРНЕТА ==========
  window.addEventListener('online', () => {
    console.log('✅ Интернет восстановлен');
    isConnected = true;
    if (window.loadProductsFromFirestore) {
      window.loadProductsFromFirestore();
    }
  });

  window.addEventListener('offline', () => {
    console.warn('⚠️ Интернет потерян (будут использоваться кэшированные данные)');
    isConnected = false;
  });

  // ========== ЭКСПОРТИРУЕМ СТАТУС ==========
  window.getFirebaseStatus = () => ({
    ready: isFirebaseReady,
    connected: isConnected,
    db: db,
    hasDb: !!db
  });

  console.log('✅ Firestore модуль загружен');
  console.log('📝 Используйте window.loadProductsFromFirestore() для загрузки товаров');
  console.log('📊 Используйте window.getFirebaseStatus() для проверки статуса');

</script>
